<!DOCTYPE html><!--Indica que es un html-->
<html lang="es"><!--Indica el lenguaje del html(en este caso "es" de español)-->
<head><!--Información y configuración de la página-->
    <meta charset="UTF-8"><!--Indica la codificación de caracteres, útil para que las tildes se vean y no den problemas-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Hace que el ancho de la página se adapte al dispositivo y el 1.0 indica el zoom, 1.0 es 100% de zoom-->
    <link rel="stylesheet" href="style.css"><!--Vincula el html con el style.css-->
</head>

<body><!--Cuerpo de la página-->

    <h1 style="text-align: center;">Deportes González</h1><!--El text align sirve para centrar el texto o alinearlo a donde queramos-->

    <p style="text-align: center;">Todo lo que necesitas para realizar cualquier deporte que quieras</p>


</body>
</html>
