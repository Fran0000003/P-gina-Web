<!DOCTYPE html><!--Indica que es un html-->
<html lang="es"><!--Indica el lenguaje del html(en este caso "es" de español)-->

<head><!--contiene información sobre la página, como los metadatos, el título de la pestaña y el enlace al CSS.-->
    <meta charset="UTF-8"><!--Permite representar correctamente caracteres como ñ, á y é.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--Hace que el ancho de la página se adapte a la pantalla del dispositivo.-->

    <meta name="description" content="Deportes González, tienda de ropa, calzado y equipamiento deportivo."><!--Define una descripción del contenido de la página.-->

    <meta name="keywords" content="deportes, ropa deportiva, zapatillas, fútbol, fitness, running"><!--Especifica palabras clave relacionadas con la página.-->

    <title>Deportes González</title>

    <link rel="stylesheet" href="style.css"><!--Este código conecta el documento HTML con el archivo style.css-->
</head>


<body><!--contiene lo que se muestra en la página: títulos, imágenes, textos y enlaces.-->

   <h1>Deportes González</h1><!--Sirven para crear títulos y subtítulos organizados por niveles. Normalmente, h1 es el título principal y h2 y h3 organizan las secciones.-->

    <img src="Logo.png" alt="Logo" class="logo"><!--Inserta una imagen. src indica dónde está el archivo y alt proporciona una descripción alternativa.-->

    <nav><!--Agrupa los enlaces que forman el menú de navegación.-->
    <a href="index.html">Home</a><!--Crea un enlace a otra página o recurso. El atributo href indica el destino.-->

</body>
</html>
